<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>OPay Checkout - RefAI</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .checkout-card { max-width: 450px; margin: 40px auto; background: var(--bg-secondary); padding: 30px; border-radius: 12px; border-top: 5px solid #10b981; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .opay-box { background: #064e3b; padding: 25px; border-radius: 8px; margin: 20px 0; border: 1px dashed #10b981; }
        .qr-code { width: 200px; height: 200px; background: white; padding: 10px; border-radius: 8px; margin: 15px auto; object-fit: contain; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(16,185,129,0.3); border-left-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container"><a href="../index.html" class="navbar-brand">🏆 RefAI Checkout</a></div></nav>
    <main class="container">
        
        <div class="checkout-card" id="checkoutUI">
            <h2 style="margin-top: 0; color: #10b981;">Pay with OPay</h2>
            <p class="text-secondary">Scan the QR code or transfer to the account below to activate your <strong id="planNameText" style="color:white; text-transform:uppercase;">Plan</strong>.</p>
            
            <div id="loadingState">
                <div class="spinner"></div>
                <p class="text-secondary">Connecting to OPay secure servers...</p>
            </div>

            <div class="opay-box" id="paymentDetails" style="display:none;">
                <div class="text-secondary text-sm" style="color:#a7f3d0; font-weight:bold; letter-spacing:1px;">AMOUNT TO PAY</div>
                <h1 style="color: white; margin: 5px 0; font-size: 2.5rem;" id="payAmount">₦0</h1>
                
                <img src="" id="payQr" class="qr-code">
                
                <div class="mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.1);">
                    <p class="text-sm m-0" style="color:#a7f3d0;">OR TRANSFER TO OPAY ACCOUNT:</p>
                    <h2 style="color: white; margin: 5px 0; letter-spacing: 3px; font-size: 2rem; cursor: pointer;" id="payAcc" onclick="navigator.clipboard.writeText(this.innerText); alert('Copied!')">----</h2>
                    <p class="text-sm font-bold m-0" style="color:white;" id="payName">RefAI</p>
                </div>
            </div>

            <div id="waitingState" style="display:none; margin-top: 20px; align-items: center; justify-content: center; gap: 10px;">
                <div class="spinner" style="width: 20px; height: 20px; margin:0; border-width:3px;"></div>
                <span class="text-warning font-bold">Awaiting Payment...</span>
            </div>
        </div>

    </main>

    <script src="../js/config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const leagueId = urlParams.get('leagueId'); 
        const plan = urlParams.get('plan');

        async function initPayment() {
            if(!leagueId || !plan) {
                document.getElementById('checkoutUI').innerHTML = `<h2 class="text-error">⚠️ Invalid Link</h2><p>Please restart registration.</p>`;
                return;
            }

            document.getElementById('planNameText').innerText = plan;

            try {
                // Ask Backend to securely generate OPay QR/Account
                const res = await fetch(`${API_URL}/api/payments/opay/generate`, { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ leagueId, plan }) 
                });
                
                if(!res.ok) throw new Error();
                const data = await res.json();
                
                document.getElementById('loadingState').style.display = 'none'; 
                document.getElementById('paymentDetails').style.display = 'block'; 
                document.getElementById('waitingState').style.display = 'flex';
                
                document.getElementById('payAmount').innerText = `₦${data.amount.toLocaleString()}`; 
                document.getElementById('payQr').src = data.qr_url; 
                document.getElementById('payAcc').innerText = data.account_number; 
                document.getElementById('payName').innerText = data.merchant_name;

                checkPaymentStatus(data.transaction_ref);

            } catch(e) { 
                document.getElementById('checkoutUI').innerHTML = "<h3 class='text-error'>OPay Gateway Offline</h3><p>Cannot connect to backend server.</p>"; 
            }
        }

        async function checkPaymentStatus(ref) {
            const timer = setInterval(async () => {
                try {
                    const res = await fetch(`${API_URL}/api/payments/verify/${ref}`); 
                    const data = await res.json();
                    
                    if(data.status === 'Paid') { 
                        clearInterval(timer); 
                        document.getElementById('checkoutUI').innerHTML = `<div style="font-size:4rem; margin-bottom:10px;">✅</div><h2 style="color:#10b981;">Payment Successful!</h2><p class="text-secondary">Your league is now active.</p>`; 
                        setTimeout(() => window.location.href = 'league-dashboard.html', 3000); 
                    }
                } catch(e) {}
            }, 5000);
        }

        initPayment();
    </script>
</body>
</html>
