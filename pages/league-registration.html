<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register League - RefAI</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .pricing-card { cursor: pointer; border: 2px solid #333; transition: 0.3s; background: var(--bg-secondary); }
        .pricing-card:hover { border-color: var(--primary-color); transform: translateY(-3px); }
        /* Style for the selected radio button card */
        input[type="radio"]:checked + div { border-color: var(--primary-color); }
        
        .plan-radio { display: none; } /* Hide actual radio circle */
        .plan-label { display: block; height: 100%; }
        .plan-radio:checked + .pricing-card { 
            border-color: var(--primary-color); 
            background: rgba(37, 99, 235, 0.1); 
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="navbar-brand">🏆 RefAI</a>
            <ul class="navbar-nav">
                <li><a href="index.html" class="navbar-item">Home</a></li>
                <li><a href="browse-leagues.html" class="navbar-item">Leagues</a></li>
                <li><a href="login.html" class="btn btn-primary btn-sm">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container mt-5">
        <div style="max-width: 800px; margin: 0 auto;">
            <h1>Register Your League</h1>
            <p class="text-secondary">Start managing your grassroots football league with RefAI's powerful tools.</p>

            <div class="card mt-4">
                <form id="leagueRegistrationForm">
                    <h3>League Information</h3>
                    
                    <div class="form-group">
                        <label class="form-label">League Name *</label>
                        <input type="text" id="leagueName" class="form-input" required placeholder="e.g., Lagos Premier League">
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Location (City/State) *</label>
                            <input type="text" id="location" class="form-input" required placeholder="e.g., Lagos">
                        </div>

                        <div class="form-group">
                            <label class="form-label">League Type *</label>
                            <select id="leagueType" class="form-select" required>
                                <option value="">Select Type</option>
                                <!-- HERE IS THE NEW 4-A-SIDE OPTION -->
                                <option value="4-a-side">4-a-side</option>
                                <option value="5-a-side">5-a-side</option>
                                <option value="7-a-side">7-a-side</option>
                                <option value="11-a-side">11-a-side</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-input" rows="3" placeholder="Tell us about your league..."></textarea>
                    </div>

                    <h3 class="mt-4">Contact Information</h3>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Admin Name *</label>
                            <input type="text" id="contactName" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" id="phone" class="form-input" required placeholder="+234 801 234 5678">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address *</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>

                    <h3 class="mt-4">Choose Your Plan</h3>

                    <div class="grid grid-3 mb-4">
                        <!-- Free Plan -->
                        <label class="plan-label">
                            <input type="radio" name="plan" value="free" class="plan-radio" required>
                            <div class="card pricing-card text-center" style="height: 100%;">
                                <h4 style="margin-top: 0;">Free</h4>
                                <p style="font-size: 1.8rem; font-weight: 900; margin: 10px 0;">₦0</p>
                                <p class="text-secondary text-sm m-0">1 league, 4 teams</p>
                                <p class="text-secondary text-sm m-0">YouTube Streaming</p>
                            </div>
                        </label>

                        <!-- Basic Plan -->
                        <label class="plan-label">
                            <input type="radio" name="plan" value="basic" class="plan-radio" required checked>
                            <div class="card pricing-card text-center" style="height: 100%;">
                                <h4 style="margin-top: 0; color: var(--primary-color);">Basic</h4>
                                <p style="font-size: 1.8rem; font-weight: 900; margin: 10px 0; color: var(--primary-color);">₦7,500<span style="font-size:1rem; color:#666;">/mo</span></p>
                                <p class="text-secondary text-sm m-0">3 leagues, unlimited teams</p>
                                <p class="text-secondary text-sm m-0">Premium HLS Streaming</p>
                            </div>
                        </label>

                        <!-- Pro Plan -->
                        <label class="plan-label">
                            <input type="radio" name="plan" value="pro" class="plan-radio" required>
                            <div class="card pricing-card text-center" style="height: 100%;">
                                <h4 style="margin-top: 0; color: var(--error-color);">Pro</h4>
                                <p style="font-size: 1.8rem; font-weight: 900; margin: 10px 0; color: var(--error-color);">₦20,000<span style="font-size:1rem; color:#666;">/mo</span></p>
                                <p class="text-secondary text-sm m-0">Unlimited everything</p>
                                <p class="text-secondary text-sm m-0">AWS / Mux Broadcasting</p>
                            </div>
                        </label>
                    </div>

                    <div class="form-group">
                        <label style="display: flex; align-items: center; cursor: pointer; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;">
                            <input type="checkbox" required style="margin-right: 10px; width: 18px; height: 18px;">
                            <span class="text-sm">I agree to the <a href="terms-of-service.html" style="color: var(--primary-color);">Terms of Service</a> and <a href="privacy-policy.html" style="color: var(--primary-color);">Privacy Policy</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-full mt-2" id="submitBtn" style="font-size: 1.1rem; padding: 15px;">
                        Proceed to Account Setup
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer style="background: var(--bg-secondary); padding: 3rem 0; margin-top: 4rem;">
        <div class="container text-center">
            <p>&copy; 2024 RefAI. All rights reserved. 🇳🇬</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.getElementById('leagueRegistrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ Processing... Please wait';

            // Gather all form data
            const formData = {
                leagueName: document.getElementById('leagueName').value,
                location: document.getElementById('location').value,
                leagueType: document.getElementById('leagueType').value, // This will grab "4-a-side" perfectly!
                description: document.getElementById('description').value,
                contactName: document.getElementById('contactName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                plan: document.querySelector('input[name="plan"]:checked').value
            };

            try {
                // Send to backend
                const response = await fetch(`${API_URL}/api/leagues/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) throw new Error('Registration failed');
                
                const data = await response.json();

                // Routing Logic based on the Plan chosen
                if (formData.plan !== 'free') {
                    // Send them to the payment gateway
                    window.location.href = `payment-moniepoint.html?leagueId=${data.leagueId}&plan=${formData.plan}`;
                } else {
                    // Send them straight to the dashboard
                    showToast('League registered successfully! Welcome to RefAI.', 'success');
                    setTimeout(() => {
                        window.location.href = 'league-dashboard.html';
                    }, 2000);
                }
            } catch (error) {
                console.error(error);
                // Safe Fallback for testing when database is offline:
                alert("Database offline. Simulating successful registration for testing.");
                if (formData.plan !== 'free') window.location.href = `payment-moniepoint.html?plan=${formData.plan}`;
                else window.location.href = 'league-dashboard.html';
                
                submitBtn.disabled = false;
                submitBtn.innerText = 'Proceed to Account Setup';
            }
        });
    </script>
</body>
</html>
