<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Video Library - RefAI</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .hero-video { position: relative; width: 100%; height: 50vh; min-height: 400px; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .hero-video img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .hero-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px; background: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%); }
        .hero-title { font-size: 3rem; font-weight: 900; margin: 0; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        
        .video-row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scroll-snap-type: x mandatory; }
        .video-card { flex: 0 0 300px; scroll-snap-align: start; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s; cursor: pointer; }
        .video-card:hover { transform: scale(1.05); border-color: var(--primary-color); z-index: 10; }
        .thumbnail { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: white; opacity: 0.8; transition: 0.2s; }
        .video-card:hover .play-icon { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        .duration-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .empty-state { width: 100%; text-align: center; padding: 40px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px dashed #444; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container"><a href="../index.html" class="navbar-brand">🏆 RefAI VOD</a></div></nav>

    <main class="container mt-4">
        
        <!-- FEATURED VIDEO -->
        <div id="featuredVideo"></div>

        <!-- REPLAYS & HIGHLIGHTS -->
        <h2 style="margin-top: 30px; margin-bottom: 10px;">📺 Full Match Replays & Highlights</h2>
        <div class="video-row" id="videoGrid">
            <div class="empty-state">⏳ Connecting to database...</div>
        </div>

    </main>

    <script src="../js/config.js"></script>
    <script>
        const leagueId = localStorage.getItem('leagueId');

        async function fetchVideos() {
            try {
                if(!leagueId) throw new Error();
                const res = await fetch(`${API_URL}/api/leagues/${leagueId}/videos`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }});
                if(!res.ok) throw new Error();
                const videos = await res.json();

                if(videos.length === 0) {
                    document.getElementById('videoGrid').innerHTML = "<div class='empty-state'>No videos available.</div>";
                    return;
                }

                // Render Featured Video (Latest one)
                const f = videos[0];
                document.getElementById('featuredVideo').innerHTML = `
                    <div class="hero-video">
                        <img src="${f.thumbnail_url}" alt="Featured">
                        <div class="hero-content">
                            <span class="badge badge-error mb-2">LATEST MATCH</span>
                            <h1 class="hero-title">${f.title}</h1>
                            <p style="font-size: 1.2rem; color: #e2e8f0; max-width: 600px;">Watch the thrilling clash in full 1080p HD.</p>
                            <button class="btn mt-3" style="background: white; color: black; font-weight: bold; padding: 10px 30px; font-size: 1.1rem;" onclick="window.location.href='match-view.html?id=${f.match_id}'">▶️ Play Full Match</button>
                        </div>
                    </div>`;

                // Render Remaining Videos
                document.getElementById('videoGrid').innerHTML = videos.map(v => `
                    <div class="video-card" onclick="window.location.href='match-view.html?id=${v.match_id}'">
                        <div class="thumbnail"><img src="${v.thumbnail_url}"><div class="play-icon">▶️</div><div class="duration-badge">${v.duration}</div></div>
                        <div style="padding: 15px;"><h3 style="margin:0 0 5px 0;">${v.title}</h3><p class="text-secondary text-sm m-0">${v.date} • ${v.type}</p></div>
                    </div>
                `).join('');

            } catch(e) { document.getElementById('videoGrid').innerHTML = "<div class='empty-state text-error'>⚠️ Database Offline</div>"; }
        }

        fetchVideos();
    </script>
</body>
</html>
