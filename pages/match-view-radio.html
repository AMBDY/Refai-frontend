<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Radio Tracker - RefAI</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .radio-scoreboard { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .score-display { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
        .team-name { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; flex: 1; }
        .score-box { font-size: 3rem; font-weight: 900; color: var(--primary-color); background: rgba(0,0,0,0.5); padding: 5px 25px; border-radius: 8px; }
        .match-clock { font-size: 1.2rem; font-weight: bold; color: var(--error-color); animation: pulse 2s infinite; }
        .feed-container { background: var(--bg-secondary); border-radius: 12px; padding: 20px; min-height: 400px; border: 1px solid #333; }
        .event-item { display: flex; gap: 15px; padding: 15px; border-radius: 8px; background: var(--bg-primary); margin-bottom: 10px; border-left: 5px solid transparent; animation: slideDown 0.4s ease-out; }
        .event-item.goal { border-left-color: #22c55e; } .event-item.card-yellow { border-left-color: #eab308; } .event-item.card-red { border-left-color: #ef4444; } .event-item.sub { border-left-color: #3b82f6; }
        .event-time { font-weight: 900; color: var(--primary-color); font-size: 1.1rem; width: 40px; }
        .event-icon { font-size: 1.5rem; }
        .event-details h4 { margin: 0 0 5px 0; font-size: 1.1rem; text-transform: uppercase; }
        .event-details p { margin: 0; color: #a0aec0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container flex justify-between items-center"><a href="../index.html" class="navbar-brand">🏆 RefAI</a><a href="live-matches.html" class="btn btn-secondary btn-sm">← Back to Matches</a></div></nav>
    
    <main class="container mt-5" style="max-width: 800px; margin: 0 auto;">
        <div class="radio-scoreboard">
            <div class="match-clock" id="matchClock">--:--</div>
            <div class="score-display">
                <div class="team-name" id="homeName" style="text-align: right;">---</div>
                <div class="score-box"><span id="homeScore">0</span> - <span id="awayScore">0</span></div>
                <div class="team-name" id="awayName" style="text-align: left;">---</div>
            </div>
            <p class="text-secondary m-0" id="matchStatus">Connecting to database...</p>
        </div>

        <div class="feed-container">
            <div class="flex justify-between items-center mb-4 border-b pb-2" style="border-color: #333;">
                <h2 style="margin: 0;">Live Play-by-Play</h2>
                <span class="badge badge-error">📻 Radio Mode</span>
            </div>
            <div id="eventsFeed">
                <p class="text-center text-secondary py-5">Loading events...</p>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script>
        const matchId = new URLSearchParams(window.location.search).get('id');
        let lastEventCount = 0;

        async function fetchMatchData() {
            if(!matchId) {
                document.getElementById('matchStatus').innerText = "⚠️ No Match ID provided.";
                document.getElementById('eventsFeed').innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/matches/${matchId}/details`);
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                
                document.getElementById('homeName').innerText = data.home_name;
                document.getElementById('awayName').innerText = data.away_name;
                document.getElementById('homeScore').innerText = data.home_score;
                document.getElementById('awayScore').innerText = data.away_score;
                document.getElementById('matchClock').innerText = `${data.match_clock}'`;
                document.getElementById('matchStatus').innerText = data.status === 'Live' ? '🔴 Match is LIVE' : data.status;

                const eventRes = await fetch(`${API_URL}/api/matches/${matchId}/events`);
                const events = await eventRes.json();
                
                if(events.length > lastEventCount) {
                    renderEvents(events);
                    lastEventCount = events.length;
                } else if (events.length === 0 && lastEventCount === 0) {
                    document.getElementById('eventsFeed').innerHTML = '<p class="text-center text-secondary py-5">Awaiting kickoff...</p>';
                }

            } catch (err) {
                document.getElementById('matchStatus').innerText = "⚠️ Database Offline";
                document.getElementById('eventsFeed').innerHTML = '<p class="text-error text-center py-5">Failed to connect to backend server.</p>';
            }
        }

        function renderEvents(events) {
            const feed = document.getElementById('eventsFeed');
            feed.innerHTML = '';
            [...events].reverse().forEach(ev => {
                feed.innerHTML += `
                    <div class="event-item ${ev.class}">
                        <div class="event-time">${ev.time}'</div>
                        <div class="event-icon">${ev.icon}</div>
                        <div class="event-details"><h4>${ev.title}</h4><p>${ev.detail}</p></div>
                    </div>`;
            });
        }

        fetchMatchData();
        setInterval(fetchMatchData, 10000);
    </script>
</body>
</html>
