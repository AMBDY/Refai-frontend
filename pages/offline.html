<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - RefAI</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
        <div>
            <div style="font-size: 5rem; margin-bottom: 2rem;">📡</div>
            <h1>You're Offline</h1>
            <p class="text-secondary" style="max-width: 400px; margin: 1rem auto;">
                No internet connection. Don't worry - your data is saved and will sync when you're back online.
            </p>
            <button onclick="location.reload()" class="btn btn-primary mt-4">Try Again</button>
        </div>
    </div>
</body>
</html>
