<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - RefAI</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="card" style="max-width: 450px; width: 90%;">
            <h2>Reset Password</h2>
            <p class="text-secondary">Enter your email and we'll send you a reset link</p>
            <form id="forgotForm" class="mt-4">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
                <div class="text-center mt-3">
                    <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            try {
                await apiRequest('/api/auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                showToast('Reset link sent! Check your email.', 'success');
            } catch (error) {
                showToast('Error sending reset link', 'error');
            }
        });
    </script>
</body>
</html>
