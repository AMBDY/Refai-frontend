<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Payment History - RefAI</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #333; background: var(--bg-secondary); margin-bottom: 5px; border-radius: 6px; }
        .tx-amount { font-size: 1.2rem; font-weight: 900; color: #10b981; }
        .empty-state { text-align: center; padding: 40px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px dashed #444; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container flex justify-between items-center"><a href="../index.html" class="navbar-brand">🏆 RefAI</a><a href="league-dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a></div></nav>

    <main class="container mt-5" style="max-width: 800px; margin: 0 auto;">
        <div class="flex justify-between items-center mb-4">
            <div><h1 style="margin:0;">Payment History</h1><p class="text-secondary">All incoming team dues and ticket payouts.</p></div>
            <button class="btn btn-primary" onclick="alert('Downloading PDF Ledger...')">📥 Export PDF</button>
        </div>

        <div class="card mb-4" style="background: #1e293b; border-color: #3b82f6;">
            <div class="text-secondary text-sm">TOTAL PLATFORM BALANCE</div>
            <div style="font-size: 3rem; font-weight: 900; color: white;" id="totalBal">₦0.00</div>
        </div>

        <h3 class="mb-3">Recent Transactions</h3>
        <div id="txList"><div class="empty-state">⏳ Connecting to database...</div></div>
    </main>

    <script src="../js/config.js"></script>
    <script>
        const userId = localStorage.getItem('userId');

        async function fetchHistory() {
            try {
                if(!userId) throw new Error();
                const res = await fetch(`${API_URL}/api/users/${userId}/payments`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }});
                if(!res.ok) throw new Error();
                const data = await res.json();

                document.getElementById('totalBal').innerText = `₦${data.balance.toLocaleString()}`;

                if (data.transactions.length === 0) {
                    document.getElementById('txList').innerHTML = `<div class="empty-state">No transactions recorded.</div>`;
                    return;
                }

                document.getElementById('txList').innerHTML = data.transactions.map(tx => `
                    <div class="tx-row">
                        <div>
                            <strong style="display:block; font-size: 1.1rem;">${tx.description}</strong>
                            <span class="text-secondary text-sm">Via ${tx.gateway} • ${tx.date}</span>
                        </div>
                        <div style="text-align: right;">
                            <div class="tx-amount" style="color: ${tx.status === 'Pending' ? '#f59e0b' : '#10b981'};">${tx.type === 'credit' ? '+' : '-'} ₦${tx.amount.toLocaleString()}</div>
                            <span class="badge ${tx.status === 'Pending' ? 'badge-warning' : 'badge-success'}">${tx.status}</span>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                document.getElementById('txList').innerHTML = `<div class="empty-state text-error">⚠️ Database connection failed.</div>`;
            }
        }
        fetchHistory();
    </script>
</body>
</html>
