<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>League Table - RefAI</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .league-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--bg-secondary); border-radius: 8px; overflow: hidden; }
        .league-table th { background: #1a1a2e; color: #a0aec0; padding: 15px; text-align: center; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .league-table th:nth-child(2) { text-align: left; }
        .league-table td { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .league-table td:nth-child(2) { text-align: left; font-weight: bold; }
        .league-table tr:hover { background: rgba(255,255,255,0.05); }
        .pts-col { font-weight: 900; color: var(--primary-color); font-size: 1.1rem; }
        .zone-border { border-left: 5px solid transparent; }
        .legend-box { display: flex; gap: 15px; margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: bold; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-secondary); padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; border: 1px solid #444; }
        .zone-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 10px; align-items: center; background: #1a1a2e; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container flex justify-between items-center"><a href="league-dashboard.html" class="btn btn-secondary btn-sm">← Dashboard</a><h2 style="margin: 0;">League Standings</h2></div></nav>
    <main class="container mt-5">
        
        <div class="grid grid-3 mb-5">
            <div class="card text-center"><h1 id="statViewers" style="color: #3b82f6; font-size: 3rem; margin: 0;">0</h1><p class="text-secondary">Match Viewers</p></div>
            <div class="card text-center"><h1 id="statGoals" style="color: #22c55e; font-size: 3rem; margin: 0;">0</h1><p class="text-secondary">Goals Scored</p></div>
            <div class="card text-center"><h1 id="statReds" style="color: #ef4444; font-size: 3rem; margin: 0;">0</h1><p class="text-secondary">Red Cards</p></div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center">
                <h2 style="margin:0;">🏆 Official League Table</h2>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('zoneConfigModal').style.display='flex'" class="btn btn-warning" style="color: black;">⚙️ Zones</button>
                    <button onclick="downloadCSV('leagueTable.csv')" class="btn" style="background: #10b981; color: white;">📥 CSV</button>
                </div>
            </div>
            
            <table class="league-table" id="leagueTable">
                <thead><tr><th>Pos</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="10" class="text-center text-secondary py-4">⏳ Loading database...</td></tr></tbody>
            </table>
            <div id="tableLegend" class="legend-box" style="display:none;"></div>
        </div>
    </main>

    <!-- ZONE CONFIGURATOR MODAL -->
    <div id="zoneConfigModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4"><h2 style="margin: 0;">Customize Zones</h2><label><input type="checkbox" id="enableZonesToggle"> Enable Colors</label></div>
            <div id="zoneConfigList"></div>
            <button onclick="addNewZoneRow()" class="btn btn-secondary w-full mt-3 mb-4">➕ Add Another Zone Rule</button>
            <div class="flex gap-2 mt-4"><button class="btn btn-secondary flex-1" onclick="document.getElementById('zoneConfigModal').style.display='none'">Cancel</button><button class="btn btn-primary flex-1" onclick="saveAndApplyZones()">Save Rules</button></div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        const leagueId = localStorage.getItem('leagueId') || 'unknown';
        let tableData = []; 
        let leagueZoneRules = { enabled: false, rules: [] };

        async function loadData() {
            try {
                // Fetch Stats
                const statRes = await fetch(`${API_URL}/api/leagues/${leagueId}/analytics`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                if(statRes.ok) {
                    const stats = await statRes.json();
                    document.getElementById('statViewers').innerText = stats.viewers || 0;
                    document.getElementById('statGoals').innerText = stats.goals || 0;
                    document.getElementById('statReds').innerText = stats.reds || 0;
                }

                // Fetch Rules & Table Data
                const rulesRes = await fetch(`${API_URL}/api/leagues/${leagueId}/table-rules`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                if(rulesRes.ok) leagueZoneRules = await rulesRes.json();

                const tableRes = await fetch(`${API_URL}/api/leagues/${leagueId}/standings`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                if(!tableRes.ok) throw new Error();
                
                tableData = await tableRes.json();
                
                if(tableData.length === 0) {
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="text-center">No teams registered yet.</td></tr>';
                    return;
                }

                renderConfiguratorUI();
                renderTable();
            } catch (err) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="text-center text-error">⚠️ Database connection failed.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const legendBox = document.getElementById('tableLegend');
            tbody.innerHTML = ''; legendBox.innerHTML = '';

            if (leagueZoneRules.enabled && leagueZoneRules.rules && leagueZoneRules.rules.length > 0) {
                legendBox.style.display = 'flex';
                leagueZoneRules.rules.forEach(r => legendBox.innerHTML += `<div class="legend-item"><div class="color-dot" style="background: ${r.color};"></div><span>${r.title}</span></div>`);
            } else { legendBox.style.display = 'none'; }

            tableData.forEach((team, index) => {
                let position = index + 1;
                let rowColor = "transparent";
                if (leagueZoneRules.enabled && leagueZoneRules.rules) {
                    const rule = leagueZoneRules.rules.find(r => position >= r.startPos && position <= r.endPos);
                    if (rule) rowColor = rule.color;
                }
                tbody.innerHTML += `<tr><td class="zone-border" style="border-left-color: ${rowColor};">${position}</td><td>${team.name}</td><td>${team.p}</td><td>${team.w}</td><td>${team.d}</td><td>${team.l}</td><td>${team.gf}</td><td>${team.ga}</td><td>${team.gd}</td><td class="pts-col">${team.pts}</td></tr>`;
            });
        }

        // Zone UI setup (Same logic as before)
        function renderConfiguratorUI() {
            document.getElementById('enableZonesToggle').checked = leagueZoneRules.enabled;
            const container = document.getElementById('zoneConfigList');
            container.innerHTML = '';
            if(leagueZoneRules.rules) {
                leagueZoneRules.rules.forEach((rule, idx) => {
                    container.innerHTML += `<div class="zone-row" id="z_${idx}"><input type="text" class="form-input title-input" value="${rule.title}"><input type="number" class="form-input start-input" value="${rule.startPos}"><input type="number" class="form-input end-input" value="${rule.endPos}"><input type="color" class="form-input color-input" value="${rule.color}" style="height:40px;"><button onclick="document.getElementById('z_${idx}').remove()" style="background:none; border:none; color:red;">✖</button></div>`;
                });
            }
        }

        function addNewZoneRow() {
            const id = Date.now();
            document.getElementById('zoneConfigList').innerHTML += `<div class="zone-row" id="z_${id}"><input type="text" class="form-input title-input" placeholder="Zone Name"><input type="number" class="form-input start-input" placeholder="Start"><input type="number" class="form-input end-input" placeholder="End"><input type="color" class="form-input color-input" value="#3b82f6" style="height:40px;"><button onclick="document.getElementById('z_${id}').remove()" style="background:none; border:none; color:red;">✖</button></div>`;
        }

        async function saveAndApplyZones() {
            leagueZoneRules.enabled = document.getElementById('enableZonesToggle').checked;
            leagueZoneRules.rules = [];
            document.querySelectorAll('.zone-row').forEach(row => {
                const title = row.querySelector('.title-input').value;
                const startPos = parseInt(row.querySelector('.start-input').value);
                const endPos = parseInt(row.querySelector('.end-input').value);
                const color = row.querySelector('.color-input').value;
                if (title && startPos && endPos) leagueZoneRules.rules.push({ title, startPos, endPos, color });
            });

            try {
                await fetch(`${API_URL}/api/leagues/${leagueId}/table-rules`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }, 
                    body: JSON.stringify(leagueZoneRules) 
                });
                document.getElementById('zoneConfigModal').style.display = 'none';
                renderTable();
            } catch(e) { alert("Failed to save rules to database"); }
        }

        // Export to CSV Function
        function downloadCSV(filename) {
            let csv = [];
            let rows = document.querySelectorAll("#leagueTable tr");
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) row.push(cols[j].innerText);
                csv.push(row.join(","));
            }
            let csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
            let downloadLink = document.createElement("a");
            downloadLink.download = filename; downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none"; document.body.appendChild(downloadLink); downloadLink.click();
        }

        loadData();
    </script>
</body>
</html>
